# متادیتای بسته‌بندی + تنظیمات ابزارها.
#
# **هسته هیچ وابستگی اجباری ندارد.** Black-Scholes، IV، تلگرام و SQLite
# همه با کتابخانه‌ی استاندارد کار می‌کنند — و ۷۳۷ تست بدون نصب
# numpy/pandas/scipy پاس می‌شوند. پس `dependencies` خالی است و هرچه
# اختیاری است در extra نشسته.
#
# چرا از `requirements.txt` خوانده نمی‌شود: آن فایل برای **محیط توسعه**
# است و pytest و pytse-client هم دارد. یک نصبِ بسته نباید pytest بیاورد.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garnet-trader"
version = "0.5.0"
description = "سیگنال‌دهی دستی معاملات آپشن بورس تهران (بدون اجرای سفارش)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Omid Rafiee" }]
keywords = ["options", "tehran-stock-exchange", "tsetmc", "trading-signals"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Natural Language :: Persian",
]
dependencies = []

[project.optional-dependencies]
# خواندن config/settings.yaml. بدونش ربات با پیش‌فرض‌ها کار می‌کند ولی
# `load_settings` خطای خوانا می‌دهد اگر فایل باشد و خوانده نشود.
config = ["PyYAML>=6.0"]
# داشبورد وب
web = ["fastapi>=0.110", "uvicorn>=0.27", "PyYAML>=6.0"]
# کشف API کارگزاری (مسیر جایگزین HAR هیچ نصبی نمی‌خواهد)
discovery = ["playwright>=1.44"]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27", "PyYAML>=6.0"]

[project.scripts]
# ⚠️ هیچ‌کدام سفارشی ثبت نمی‌کنند؛ فقط سیگنال و داشبورد.
garnet-trader = "main:main"
garnet-dashboard = "web.__main__:main"

[project.urls]
Repository = "https://github.com/OmidRafiee/GarnetTrader"

[tool.setuptools]
# `main.py` و `bootstrap.py` پکیج نیستند، ماژول‌اند — بدون این، نقطه‌ی
# ورود `garnet-trader` روی نصبِ واقعی با ImportError می‌افتاد.
py-modules = ["main", "bootstrap", "conftest"]
# لایه‌ی اجرا عمداً بسته‌بندی **می‌شود** ولی هیچ‌کس صدایش نمی‌زند
# (گارد AST تضمین می‌کند). حذفش از بسته، قرارداد را پنهان می‌کرد.
packages = [
    "backtest",
    "brokers",
    "config",
    "data",
    "discovery",
    "execution",
    "market",
    "monitoring",
    "notifiers",
    "pricing",
    "risk",
    # ابزارهای کاربر: ضبط fixture، تبدیل HAR، لاگین کارگزاری
    "scripts",
    "signals",
    "storage",
    "strategies",
    "web",
]

[tool.setuptools.package-data]
# فایل‌های استاتیک داشبورد و تنظیمات نمونه. بدون این، `garnet-dashboard`
# نصب می‌شد ولی صفحه‌ی خالی می‌داد.
web = ["static/*"]
config = ["settings.example.yaml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
# `build/` کپیِ ساخته‌شده‌ی همین کد است؛ لینت کردنش یعنی هر خطا
# دو بار گزارش شود.
extend-exclude = ["build", "dist"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG", "RUF"]
ignore = [
    "RUF001", # کاراکترهای فارسی/عربی شبیه‌به‌هم در رشته‌ها و کامنت‌ها
    "RUF002",
    "RUF003",
    # `str, Enum` عمدی است، نه اشتباه: مدل‌ها با `json.dumps` سریالایز
    # می‌شوند و در SQLite می‌نشینند، پس عضو باید *واقعاً* یک رشته باشد.
    # `StrEnum` رفتار `str()` را عوض می‌کند و می‌تواند بی‌صدا شکل داده‌ی
    # ذخیره‌شده را تغییر بدهد؛ ارزشش را ندارد.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"] # فیکسچرها به‌عنوان آرگومان استفاده‌نشده دیده می‌شوند

# قراردادهای قابل بازنویسی (template method): امضا برای همه‌ی زیرکلاس‌ها
# یکسان است، پس هر پیاده‌سازی لزوماً همه‌ی آرگومان‌ها را لازم ندارد.
# تغییر امضا برای رضایت لینتر، قرارداد را می‌شکند.
"strategies/multi_leg.py" = ["ARG002"]
"strategies/collar_strategy.py" = ["ARG002"]
"strategies/straddle_strategy.py" = ["ARG002"]

# امضای این‌ها هم قرارداد است: `_pick` سازنده‌ها را با ورودی یکسان صدا
# می‌زند، و `implied_volatility` امضایش را با بقیه‌ی توابع قیمت‌گذاری
# هم‌شکل نگه می‌دارد.
"bootstrap.py" = ["ARG001"]
"pricing/implied_volatility.py" = ["ARG001"]

[tool.ruff.format]
quote-style = "double"
