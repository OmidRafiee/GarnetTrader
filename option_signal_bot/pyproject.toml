# تنظیمات ابزارها. متادیتای بسته‌بندی (packaging) عمداً این‌جا نیست تا
# requirements.txt تنها منبع حقیقت وابستگی‌ها بماند؛ بسته‌بندی یک تسک آینده است.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG", "RUF"]
ignore = [
    "RUF001", # کاراکترهای فارسی/عربی شبیه‌به‌هم در رشته‌ها و کامنت‌ها
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"] # فیکسچرها به‌عنوان آرگومان استفاده‌نشده دیده می‌شوند

[tool.ruff.format]
quote-style = "double"
